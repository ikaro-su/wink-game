{% extends "base.html" %}
{% block title %}再認証 | Face Practice{% endblock %}
{% block content %}
<style>
.card {
    padding: 30px;
    border: 1px solid rgba(220, 216, 207, .9);
    border-radius: 24px;
    background: rgba(255, 253, 248, .94);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}
</style>
    <!-- 認証方法を選ぶログインカード -->
    <section class="card auth-card">
        <h2>再認証</h2>
        <p class="muted">認証方法を選んでください。</p>
        <label for="login-id">ID:</label>
        <p id="login-id" autocomplete="username">{{ login_id }}</p>
        <!-- data-panelの値をface-auth.jsが読み、対応するパネルを表示する -->
        <div class="auth-tabs" role="tablist">
            <button class="auth-tab active" data-panel="password-panel" type="button">パスワード</button>
            <button class="auth-tab" data-panel="face-panel" type="button">顔認証</button>
        </div>
        <!-- パスワード認証用パネル -->
        <div id="password-panel" class="auth-panel active">
            <label for="password">パスワード</label>
            <input id="password" type="password" autocomplete="current-password">
            <button id="password-login" class="button button-primary button-wide" type="button">パスワードで認証</button>
        </div>
        <!-- 顔認証用パネル。video要素へブラウザのカメラ映像を表示する -->
        <div id="face-panel" class="auth-panel">
            <div class="camera-frame">
                <video id="face-video" autoplay muted playsinline></video>
                <div class="camera-guide"></div>
                <div id="camera-placeholder" class="camera-placeholder">「カメラを開始」を押してください</div>
            </div>
            <p id="face-status" class="status-text">IDを入力してカメラを開始します。</p>
            <button id="start-face-login" class="button button-primary button-wide" type="button">カメラを開始して顔認証</button>
        </div>
        <!-- JavaScriptから成功・失敗メッセージを表示する場所 -->
        <div id="message" class="message" aria-live="polite"></div>
    </section>
{% endblock %}
{% block scripts %}
<!-- 本人識別用のface-apiと、認証処理を担当する自作JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script type="module" src="{{ url_for('static', filename='reauth.js') }}"></script>
{% endblock %}
