{% extends "base.html" %}
{% block title %}パスワード変更 | Face Practice{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>新しいパスワードの設定</h2>
    <p>変更後の新しいパスワードを入力してください。</p>

    <div id="change-message" class="message"></div>

    <div class="form-group">
        <label for="new-password">新しいパスワード</label>
        <input type="password" id="new-password" class="form-control" required>
    </div>

    <div class="form-group">
        <label for="new-password-confirm">新しいパスワード（確認用）</label>
        <input type="password" id="new-password-confirm" class="form-control" required>
    </div>

    <button id="change-password-btn" class="button button-primary button-wide">パスワードを変更する</button>
</div>

<script type="module" src="{{ url_for('static', filename='change-password.js') }}"></script>
{% endblock %}
